# Continuous integration: unit tests + cross-build smoke.
# Also runs on a daily schedule so the main branch stays green without a push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily 06:00 UTC — catch toolchain / runner drift on main.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Check (fmt + vet + test)
        run: make check

      - name: Race detector
        run: make test-race

      - name: Build host binary
        run: make build VERSION=ci

  test-windows:
    # AF_UNIX control plane on Windows (Server 2019+ supports unix sockets).
    # gofmt is platform-independent; the fmt-check runs in the unix jobs.
    name: Test (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Vet and test
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...

      - name: Race detector
        shell: bash
        run: go test -race ./...

      - name: Build host binary
        shell: bash
        run: go build -trimpath -ldflags "-s -w -X main.version=ci" -o xai-oauth.exe ./cmd/xai-oauth

  vuln:
    # Known-vulnerability gate: fails when govulncheck finds reachable
    # vulnerabilities (stdlib or dependencies). Same scanner as `make vuln`.
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  build:
    name: Cross-build
    needs: [test, test-windows, vuln]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Cross-compile Linux / macOS / Windows
        env:
          VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          targets="
            linux/amd64
            linux/arm64
            darwin/amd64
            darwin/arm64
            windows/amd64
            windows/arm64
          "
          for t in $targets; do
            GOOS=${t%/*}
            GOARCH=${t#*/}
            ext=""
            [ "$GOOS" = "windows" ] && ext=".exe"
            out="dist/xai-oauth_${GOOS}_${GOARCH}${ext}"
            echo "Building $out"
            GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=ci-${VERSION:0:7}" \
              -o "$out" ./cmd/xai-oauth
          done
          ls -la dist
          (
            cd dist
            sha256sum xai-oauth_* > SHA256SUMS
          )
          cat dist/SHA256SUMS

      - name: Upload build artifacts
        # Keep scheduled / manual runs' binaries for a few days; PR/push still
        # smoke-build above without retaining artifacts to save storage.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xai-oauth-ci-${{ github.run_id }}
          path: |
            dist/xai-oauth_*
            dist/SHA256SUMS
          retention-days: 7
