# Build Linux and macOS binaries on version tags (v*). Windows is not supported.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Check
        run: make check

      - name: Build release assets
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Supported platforms only: Linux and macOS (Unix domain sockets).
          targets="
            linux/amd64
            linux/arm64
            darwin/amd64
            darwin/arm64
          "
          for t in $targets; do
            GOOS=${t%/*}
            GOARCH=${t#*/}
            out="dist/xai-oauth_${VERSION}_${GOOS}_${GOARCH}"
            echo "Building $out"
            GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out" ./cmd/xai-oauth
            (
              cd dist
              base="xai-oauth_${VERSION}_${GOOS}_${GOARCH}"
              tar -czf "${base}.tar.gz" "$(basename "$out")"
              rm -f "$(basename "$out")"
            )
          done
          ls -la dist
          (
            cd dist
            sha256sum *.tar.gz > SHA256SUMS
          )
          cat dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
