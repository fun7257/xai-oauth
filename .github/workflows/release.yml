# Build Linux, macOS, and Windows binaries on version tags (v*).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Check
        run: make check

      - name: Build release assets
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # AF_UNIX platforms: Linux, macOS, Windows 10 1803+/Server 2019+.
          targets="
            linux/amd64
            linux/arm64
            darwin/amd64
            darwin/arm64
            windows/amd64
            windows/arm64
          "
          for t in $targets; do
            GOOS=${t%/*}
            GOARCH=${t#*/}
            ext=""
            [ "$GOOS" = "windows" ] && ext=".exe"
            out="dist/xai-oauth_${VERSION}_${GOOS}_${GOARCH}${ext}"
            echo "Building $out"
            GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out" ./cmd/xai-oauth
            (
              cd dist
              base="xai-oauth_${VERSION}_${GOOS}_${GOARCH}"
              if [ "$GOOS" = "windows" ]; then
                zip -q "${base}.zip" "$(basename "$out")"
              else
                tar -czf "${base}.tar.gz" "$(basename "$out")"
              fi
              rm -f "$(basename "$out")"
            )
          done
          ls -la dist
          (
            cd dist
            sha256sum *.tar.gz *.zip > SHA256SUMS
          )
          cat dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
